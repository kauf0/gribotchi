name: Релиз

# Игра выложена в двух местах: врезкой на itch и отдельной страницей на
# GitHub Pages, которую можно поставить как приложение. Разложить их должен
# ОДИН прогон одной сборкой — иначе однажды на одном адресе окажется версия
# свежее, чем на другом, и отчёты об ошибках перестанут сходиться.
#
# Ключ butler живёт единственным экземпляром — в секретах репозитория, и не
# оседает ни на одном компьютере. Релиз с любой машины делается пушем тега.
on:
  push:
    tags: ['v*']
  # Запасной ручной запуск: тег уже есть, а сборку надо перевыложить.
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например 0.1.2'
        required: true

# pages и id-token нужны выкладке на GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Два релиза подряд не должны обгонять друг друга и разложить разные версии
# по двум адресам.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Версия внутри игры берётся из package.json и попадает в сводку по СОС
      # и в имя кеша service worker. Если она разойдётся с тегом, игрок будет
      # называть в отчёте не ту версию, что стоит на itch, — поэтому сверяем
      # до сборки, а не после.
      - name: Сверить версию с тегом
        run: |
          tag="${{ github.event.inputs.version || github.ref_name }}"
          tag="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::тег $tag не совпадает с package.json ($pkg) — поднимите версию и повторите"
            exit 1
          fi
          echo "версия $pkg"

      - name: Поставить butler
        run: ./scripts/get-butler.sh

      # Скрипт тот же, что и локально: типы, тесты, сборка, заливка.
      # Одна дорога вместо двух — значит CI не может разойтись с ручным релизом.
      - name: Собрать и выложить на itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: npm run publish:itch

      # Дальше идёт ТА ЖЕ папка dist, что уже уехала на itch: ни пересборки,
      # ни второго набора проверок. Байт в байт одно и то же в двух местах.
      - name: Подготовить Pages
        uses: actions/configure-pages@v5

      - name: Отправить сборку
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Выложить на GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Показать состояние сборки
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: npm run itch:status

      # Адрес itch берём из package.json — там же, откуда его берёт butler,
      # чтобы в итоге не оказалось ссылки на чужую страницу.
      - name: Итог
        run: |
          target="$(node -p "require('./package.json').itch.target")"
          echo "врезка: https://${target%%/*}.itch.io/${target##*/}"
          echo "прибор: ${{ steps.pages.outputs.page_url }}"
