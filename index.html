<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101109" />
    <meta name="description" content="ГРИБОЧИ — виртуальный чайный гриб в винтажном корпусе. Он тоже вас не забудет." />
    <title>ГРИБОЧИ</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!--
      Два подмножества, без которых нечем рисовать первый кадр: кириллица
      Handjet и каны DotGothic16, вместе около 6 КБ. Без preload браузер узнаёт
      о них только когда доберётся до fillText, то есть после загрузки и
      разбора всего модуля игры. Подмножества корпуса (PT Sans Narrow, ~140 КБ)
      здесь намеренно НЕ перечислены: экрану они не нужны.

      Пути ОТНОСИТЕЛЬНЫЕ. На itch игра лежит во врезке в подпапке, на GitHub
      Pages — в /gribotchi/; абсолютный адрес там указывает в корень чужого
      домена и не находится. Ровно на этом проект уже горел со шрифтами.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/handjet-1.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/dotgothic16-0.woff2" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
